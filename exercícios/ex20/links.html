<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(255, 8, 8);
            text-decoration: none;
        }

        a:visited {
            color: brown;
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }

        .especial {
            background-color: rgb(43, 255, 0);
        }
        a:active {
            color: blue;
        }

        a::after {
            content: " [link] ";
            font-weight: normal;
            color: rgb(228, 175, 110);
        }

        a::before {
             
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://www.youtube.com/@Victorr395" class="especial">Youtube</a></li>
        <li><a href="https://www.instagram.com/victor_d4ntas/">Instagram</a></li>
    </ul>
</body>
</html>
