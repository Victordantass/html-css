<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: rgb(196, 196, 212);
            height: 300px;
            width: 300px;
            
           border: 10px solid rgb(63, 247, 7);
           
            padding:  20px;

            margin: auto;
        }
        a {
            border-width: 5px;
            border-style: dashed;

             padding-top: 20px;
            padding-right: 20px;
            padding-bottom: 20px;
            padding-left: 20px;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>também são exemplos de box-level, mas os <a href="#"> mas os links são exemplos de caixas inline-level</a>, Vamos ver como tudo isso funciona</p> 
</body>
</html>
